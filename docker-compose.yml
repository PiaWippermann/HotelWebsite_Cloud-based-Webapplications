version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "80:80"
    networks:
      - appnet
    volumes:
      - ./backend:/app
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: miniohotel
    ports:
      - "9002:9000"
      - "9003:9001" # für das MinIO-Console UI
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_ENDPOINT=minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - ./data:/data
    networks:
      - appnet
networks:
  appnet:
